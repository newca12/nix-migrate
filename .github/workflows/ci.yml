name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    name: Format, lint, test, and build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v31

      - name: Check formatting
        run: nix develop --command cargo fmt --check

      - name: Check compilation
        run: nix develop --command cargo check --locked

      - name: Run Clippy
        run: nix develop --command cargo clippy --locked -- -D warnings

      - name: Run tests
        run: nix develop --command cargo test --locked

      - name: Build Nix package
        run: nix build --no-link --no-update-lock-file
