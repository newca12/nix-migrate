[package]
name = "nix-migrate"
version = "0.1.0"
edition = "2024"
rust-version = "1.99.1"

[dependencies]
walkdir = "2.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.54", features = ["full"] }
rmcp = "3.9"
anyhow = "1.0"
schemars = "1.2"

[dev-dependencies]
tempfile = "3.27"
