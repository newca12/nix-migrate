[package]
name = "nix-migrate"
version = "0.1.0"
edition = "2024"
rust-version = "1.99.1"
description = "A Nix-aware home-directory scanner and MCP backup assistant"
license = "MIT"
readme = "README.md"
repository = "https://github.com/newca12/nix-migrate"
keywords = ["nix", "mcp", "backup", "migration"]
categories = ["command-line-utilities"]

[dependencies]
walkdir = "2.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.54", default-features = false, features = ["macros", "rt-multi-thread", "io-std"] }
rmcp = "3.9"
schemars = "1.2"

[dev-dependencies]
tempfile = "3.27"
